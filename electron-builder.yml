# Windows NSIS 설치 파일(사용자 단위) 설정. `pnpm run dist` → dist/rcloneGUI-Setup-<버전>.exe
# 설치본에는 out/ 과 운영 의존성(zod)만 들어간다(소스·테스트·문서·하네스 제외). 코드 서명 없음.
# 제거해도 사용자 데이터(%APPDATA%\rcloneGUI)는 지우지 않는다. 로그인 항목·OS 예약(\rcloneGUI\)은 build/installer.nsh가 지운다.
appId: com.rclonegui.app
productName: rcloneGUI
directories:
    output: dist
    buildResources: build
files:
    - out/**/*
    - package.json
# 앱 밖에서 읽을 수 있는 고지. 트레이 아이콘은 out/main/assets에 번들된다(?asset)
extraResources:
    - from: THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
asar: true
# Electron fuses(INT-003 FR-21): 설치 exe를 node처럼 실행하거나(ELECTRON_RUN_AS_NODE) NODE_OPTIONS·--inspect로
# 코드를 끼워 넣지 못하게 하고, app.asar 무결성을 확인하며 asar 밖의 앱 코드를 읽지 않는다.
# Windows 작업 스케줄러가 이 exe를 사용자 권한으로 실행하므로 막는다. E2E(electron + out/)에는 영향 없음
electronFuses:
    runAsNode: false
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
# 네이티브 모듈이 없으므로 다시 빌드하지 않는다
npmRebuild: false
# Chromium 언어 팩은 한국어·영어만 넣는다
electronLanguages:
    - ko
    - en-US
win:
    target:
        - target: nsis
          arch:
              - x64
    icon: build/icon.ico
    artifactName: rcloneGUI-Setup-${version}.${ext}
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: rcloneGUI
    uninstallDisplayName: rcloneGUI
    deleteAppDataOnUninstall: false
    include: build/installer.nsh
